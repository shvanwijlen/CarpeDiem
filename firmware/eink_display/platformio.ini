; PlatformIO project config - lets this sketch be edited/built/flashed
; from VS Code (the PlatformIO IDE extension) instead of the separate
; Arduino IDE. Same code either way - src/eink_display.ino is a normal
; Arduino sketch file; PlatformIO's Arduino framework support builds it
; the same way the Arduino IDE would. See README.md for the full setup
; writeup.
; Build output goes outside the repo: this repo lives in OneDrive, whose
; sync locking of .pio/ files caused an intermittent SCons "FileNotFound
; .sconsign311.tmp" build failure. Windows-specific path (LOCALAPPDATA);
; delete this section on a non-OneDrive/non-Windows checkout.
[platformio]
build_dir = ${sysenv.LOCALAPPDATA}\pio_build\carpediem_eink

[env:esp32-s3]
platform = espressif32
; Generic Espressif reference board definition - matches the pinout of
; most ESP32-S3 dev boards sold as just "ESP32-S3" (including unbranded
; ones), this one included. If upload/behavior seems off for your
; specific board, run `pio boards esp32s3` for closer matches.
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Route Serial to the S3's native USB port (the one labeled USB, not UART/
; COM). Without this, Serial goes to UART0 and shows nothing if the cable
; is in the native USB port. If you use the UART port instead, remove it.
; If you add -DBOARD_HAS_PSRAM below, merge it into this same build_flags.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit GFX Library @ ^1.11.9

; Uncomment both lines below if your board has PSRAM populated and
; Serial reports "Canvas allocation failed" at startup (see
; src/eink_display.ino) - not every ESP32-S3 board actually has the PSRAM
; chip, so this isn't on by default. memory_type must match your board's
; actual PSRAM/flash wiring - qio_opi (octal PSRAM + quad flash) is the
; most common on ESP32-S3-DevKitC-1-alike boards; check your board's
; documentation if unsure, or try qio_qspi otherwise.
; board_build.arduino.memory_type = qio_opi
; build_flags = -DBOARD_HAS_PSRAM
